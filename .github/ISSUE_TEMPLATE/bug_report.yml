name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please check docs/TROUBLESHOOTING.md first.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: GPU, CPU and RAM
      description: The Machine tab shows these.
      placeholder: GTX 1060 6GB, i7-4770, 12 GB
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows 11
        - Windows 10
        - Linux
    validations:
      required: true
  - type: input
    id: linux
    attributes:
      label: On Linux, your distro, Wine version and NVIDIA driver
      description: The output of lsb_release -d, wine --version and nvidia-smi --query-gpu=driver_version --format=csv,noheader.
      placeholder: Ubuntu 24.04, wine-9.0, 570.86
  - type: textarea
    id: setup
    attributes:
      label: Setup tab and logs
      description: Anything marked missing on the Setup tab, and the last lines of the training log.
      render: text
