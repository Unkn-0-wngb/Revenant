name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please check docs/TROUBLESHOOTING.md first.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: GPU, CPU and RAM
      description: The Machine tab shows these.
      placeholder: GTX 1060 6GB, i7-4770, 12 GB
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11
  - type: textarea
    id: setup
    attributes:
      label: Setup tab and logs
      description: Anything marked missing on the Setup tab, and the last lines of the training log.
      render: text
